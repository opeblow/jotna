name: Bug report
description: Report a reproducible issue in the product.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Jotna.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Describe the bug and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps.
      placeholder: 1. Open the app...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, wallet, and network details.
      placeholder: Windows 11, Chrome 128, Alby, regtest
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add any relevant text, logs, or screenshots.
