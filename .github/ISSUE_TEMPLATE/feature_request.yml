name: Feature request
description: Suggest an improvement, workflow, or product enhancement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user pain point are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposal
      description: What should be built?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: Who benefits and how?
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Technical, legal, or operational constraints.
