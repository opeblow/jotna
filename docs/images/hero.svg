  <text x="122" y="368" fill="#A65C3E" font-family="Georgia,serif" font-size="56" font-style="italic" font-weight="700">Not before. Not in cash.</text>
  <text x="122" y="430" fill="#59665F" font-family="Arial,sans-serif" font-size="18">Your customer locks the payment before the rider sets off.</text>
  <text x="122" y="461" fill="#59665F" font-family="Arial,sans-serif" font-size="18">One scan at delivery releases it to you. If the parcel never</text>
  <text x="122" y="492" fill="#59665F" font-family="Arial,sans-serif" font-size="18">arrives, the money goes back on its own.</text>
